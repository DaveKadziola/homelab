name: CI Validate

on:
  # TEMP: homelab-v2 until it is renamed to develop; drop it in the cleanup PR after the rename.
  push:
    branches: [homelab-v2, develop]
  pull_request:
    branches: [homelab-v2, develop, main]

jobs:
  validate:
    runs-on: [self-hosted, homelab-dev]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Terraform
        # Installed on the runners (laptop: apt package terraform; ci-runner: utils/pve-ci-runner-lxc.sh),
        # not downloaded per job: the setup-terraform download stalled again and again.
        run: v="$(terraform version | head -1)"; echo "$v"; test "$v" = "Terraform v1.16.3"

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Ansible lint
        run: ansible-lint ansible/playbooks/

      - name: Docker Compose validate
        working-directory: compose/core
        env:
          # Placeholders only — compose uses ${VAR:?} and will not render without them.
          POSTGRES_PASSWORD: ci-validate-placeholder
          PGADMIN_EMAIL: ci@example.com
          PGADMIN_PASSWORD: ci-validate-placeholder
          HOMARR_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          LINKWARDEN_SECRET: ci-validate-placeholder
          AUTHELIA_JWT_SECRET: ci-validate-placeholder-jwt-secret-32
          AUTHELIA_SESSION_SECRET: ci-validate-placeholder-session-32
          AUTHELIA_STORAGE_KEY: ci-validate-placeholder-storage-32
          NAVIDROME_ADMIN_PASSWORD: ci-validate-placeholder
          IMMICH_DB_PASSWORD: ci-validate-placeholder
          VSUM_IMAGE: vsum:ci-validate-placeholder
          VSUM_SECRET_KEY: ci-validate-placeholder
          VSUM_DB_PASSWORD: ci-validate-placeholder
        run: docker compose --profile auth --profile media --profile vsum config

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner

      - name: Script self-tests
        run: |
          ./utils/pve-attach-nas-disks.sh --self-test
          python3 utils/pve-network.py --self-test
          python3 utils/bw-store.py --self-test
          python3 utils/tf-plan-risk.py --self-test
          python3 utils/ha.py --self-test
          python3 utils/backup/check-fresh.py --self-test
          python3 utils/pve-backup-job.py --self-test
          python3 utils/gen-proxy-config.py --self-test
          python3 utils/kuma-sync.py --self-test
          python3 utils/bootstrap/beszel_config.py --self-test
          python3 utils/prepare-infra.py --self-test
          python3 utils/trivy-scan.py --self-test
          python3 utils/release-notes.py --self-test
