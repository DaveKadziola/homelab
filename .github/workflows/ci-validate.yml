name: CI Validate

on:
  push:
    branches: [homelab-v2]
  pull_request:
    branches: [homelab-v2, main]

jobs:
  validate:
    runs-on: [self-hosted, homelab-dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Ansible lint
        run: ansible-lint ansible/playbooks/

      - name: Docker Compose validate
        working-directory: compose/core
        env:
          # Placeholders only — compose uses ${VAR:?} and will not render without them.
          POSTGRES_PASSWORD: ci-validate-placeholder
          PGADMIN_EMAIL: ci@example.com
          PGADMIN_PASSWORD: ci-validate-placeholder
          HOMARR_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          LINKWARDEN_SECRET: ci-validate-placeholder
          AUTHELIA_JWT_SECRET: ci-validate-placeholder-jwt-secret-32
          AUTHELIA_SESSION_SECRET: ci-validate-placeholder-session-32
          AUTHELIA_STORAGE_KEY: ci-validate-placeholder-storage-32
          NAVIDROME_ADMIN_PASSWORD: ci-validate-placeholder
          IMMICH_DB_PASSWORD: ci-validate-placeholder
        run: docker compose --profile auth --profile media config

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner
