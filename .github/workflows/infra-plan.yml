name: Infra Plan Prod

# Environment prod-plan, not prod: prod allows only main and needs an approval, so it rejects
# pull request refs (refs/pull/N/merge). prod-plan has no reviewers, allows every ref and holds a
# read-only (PVEAuditor) Proxmox token - docs/f3-proxmox.md "PR plan".
on:
  pull_request:
    branches: [main]

jobs:
  plan:
    runs-on: [self-hosted, homelab-prod]
    environment: prod-plan
    env:
      TF_WORKSPACE: homelab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Terraform
        # Installed on the runners (laptop: apt package terraform; ci-runner: utils/pve-ci-runner-lxc.sh),
        # not downloaded per job: the setup-terraform download stalled again and again.
        run: v="$(terraform version | head -1)"; echo "$v"; test "$v" = "Terraform v1.16.3"

      - name: Terraform init
        working-directory: terraform
        env:
          # HCP Terraform login: the CLI reads TF_TOKEN_<host>, so the token never lands in a file.
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_environment: prod
          TF_VAR_proxmox_node_name: proxmox
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ vars.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_proxmox_ssh_username: ${{ vars.PROXMOX_SSH_USERNAME }}
          # Plan does not connect over SSH, but the provider rejects an empty password.
          TF_VAR_proxmox_ssh_password: unused-by-plan
          TF_VAR_ubuntu_docker_password: ${{ secrets.UBUNTU_DOCKER_PASSWORD }}
          TF_VAR_ubuntu_docker_ssh_pub: ${{ vars.UBUNTU_DOCKER_SSH_PUB }}
        # No state lock: a plan writes no state and must never block Infra Apply Prod.
        # No refresh: the read-only token cannot read VM disks (VM.Config.Disk) or the snippets, so
        # this plan shows what the PR changes against the state; drift shows in Infra Apply Prod.
        run: terraform plan -lock=false -refresh=false -var-file=environments/prod/terraform.tfvars
