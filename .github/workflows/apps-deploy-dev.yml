name: Apps Deploy Dev

on:
  push:
    branches: [homelab-v2]
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: [self-hosted, homelab-dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping dev host
        working-directory: ansible
        run: |
          ansible-playbook -i environments/dev/hosts.ini playbooks/ping.yml

      - name: Deploy core stack (placeholder)
        run: |
          echo "Full compose deploy lands in F4."
          echo "Target: dev VM from ansible/environments/dev/hosts.ini"
