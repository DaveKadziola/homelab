name: Apps Deploy Dev

# After Infra Apply Dev, never next to it. Same split as Apps Deploy Prod:
# this workflow is its own run, and the tests are a job here.
# GitHub reads this trigger from the default branch (main).
on:
  workflow_run:
    workflows: ["Infra Apply Dev"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy. Empty means the tip of the selected branch."
        required: false
        type: string

jobs:
  # A README under ansible/ or compose/ is not a deploy. Run 39834821761
  # started one and failed in Deploy compose/core.
  paths:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, homelab-dev]
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Deploy paths only
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="${{ github.event.workflow_run.head_sha }}"
          parent="$(gh api "repos/${{ github.repository }}/commits/${sha}" --jq '.parents[0].sha')"
          files="$(gh api "repos/${{ github.repository }}/compare/${parent}...${sha}" --jq '.files[].filename')"
          if printf '%s\n' "$files" | grep -Eq '^(ansible/(playbooks/|environments/|ansible\.cfg)|compose/(core|grocery)/|config/(storage|identities|services|monitoring)\.yml|utils/bootstrap/|utils/backup/|utils/gen-proxy-config\.py|utils/gen-homarr-board\.sh|homeassistant/|utils/ha\.py|utils/dev-haos-vm\.sh|\.github/workflows/apps-deploy-dev\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    needs: paths
    if: needs.paths.outputs.run == 'true'
    runs-on: [self-hosted, homelab-dev]
    timeout-minutes: 30
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

      - name: Ping ubuntu-apps-dev
        working-directory: ansible
        run: ansible-playbook -i environments/dev/hosts.ini playbooks/ping.yml

      # Storage first: NFS must be mounted before compose binds the media libraries.
      - name: Deploy NFS loopback + backup timer
        working-directory: ansible
        env:
          HOMELAB_ENV: dev
          SAMBA_ADMIN_PASSWORD: ${{ secrets.SAMBA_ADMIN_PASSWORD }}
          SAMBA_USER1_PASSWORD: ${{ secrets.SAMBA_USER1_PASSWORD }}
          # NAS backup jobs (run-nas.sh, check-fresh.py); an empty value is not written.
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_SSH_PRIV: ${{ secrets.HA_SSH_PRIV }}
          HA_BACKUP_PASSWORD: ${{ secrets.HA_BACKUP_PASSWORD }}
          KUMA_PUSH_SECRET: ${{ secrets.KUMA_PUSH_SECRET }}
          OPNSENSE_BACKUP_SSH_PRIV: ${{ secrets.OPNSENSE_BACKUP_SSH_PRIV }}
          # Photos watcher on the NAS (utils/photos-watch.py); empty: not written, unit stays stopped.
          IMMICH_SCAN_API_KEY: ${{ secrets.IMMICH_SCAN_API_KEY }}
        run: |
          ansible-playbook -i environments/dev/hosts.ini playbooks/deploy-storage.yml

      # After deploy-storage: the NAS must export backups/vzdump before Proxmox mounts it.
      - name: Proxmox backup job (VM dumps onto the NAS)
        env:
          PROXMOX_API_URL: ${{ vars.PROXMOX_API_URL }}
          PROXMOX_API_TOKEN_ID: ${{ vars.PROXMOX_API_TOKEN_ID }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: python3 utils/pve-backup-job.py --env dev

      - name: Deploy compose/core
        working-directory: ansible
        env:
          HOMELAB_ENV: dev
          LINKWARDEN_URL: http://192.168.122.50:3001
          JELLYFIN_URL: http://192.168.122.50:8096
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          GROCERY_DB_PASSWORD: ${{ secrets.GROCERY_DB_PASSWORD }}
          GROCERY_SECRET_KEY: ${{ secrets.GROCERY_SECRET_KEY }}
          GROCERY_ADMIN_PASSWORD: ${{ secrets.GROCERY_ADMIN_PASSWORD }}
          GROCERY_PROTON_SMTP_TOKEN: ${{ secrets.GROCERY_PROTON_SMTP_TOKEN }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          PORTAINER_ADMIN_PASSWORD: ${{ secrets.PORTAINER_ADMIN_PASSWORD }}
          HOMARR_ADMIN_PASSWORD: ${{ secrets.HOMARR_ADMIN_PASSWORD }}
          HOMARR_SECRET_KEY: ${{ secrets.HOMARR_SECRET_KEY }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          AUTHELIA_JWT_SECRET: ${{ secrets.AUTHELIA_JWT_SECRET }}
          AUTHELIA_SESSION_SECRET: ${{ secrets.AUTHELIA_SESSION_SECRET }}
          AUTHELIA_STORAGE_KEY: ${{ secrets.AUTHELIA_STORAGE_KEY }}
          LINKWARDEN_ADMIN_PASSWORD: ${{ secrets.LINKWARDEN_ADMIN_PASSWORD }}
          LINKWARDEN_SECRET: ${{ secrets.LINKWARDEN_SECRET }}
          IMMICH_ADMIN_PASSWORD: ${{ secrets.IMMICH_ADMIN_PASSWORD }}
          IMMICH_USER1_PASSWORD: ${{ secrets.IMMICH_USER1_PASSWORD }}
          JELLYFIN_ADMIN_PASSWORD: ${{ secrets.JELLYFIN_ADMIN_PASSWORD }}
          NAVIDROME_ADMIN_PASSWORD: ${{ secrets.NAVIDROME_ADMIN_PASSWORD }}
          SYNCTHING_ADMIN_PASSWORD: ${{ secrets.SYNCTHING_ADMIN_PASSWORD }}
          BESZEL_ADMIN_PASSWORD: ${{ secrets.BESZEL_ADMIN_PASSWORD }}
          VSUM_SECRET_KEY: ${{ secrets.VSUM_SECRET_KEY }}
          VSUM_DB_PASSWORD: ${{ secrets.VSUM_DB_PASSWORD }}
          VSUM_OPENROUTER_KEY: ${{ secrets.VSUM_OPENROUTER_KEY }}
          VSUM_ELEVENLABS_KEY: ${{ secrets.VSUM_ELEVENLABS_KEY }}
          VSUM_TRILIUM_TOKEN: ${{ secrets.VSUM_TRILIUM_TOKEN }}
          VSUM_GIT_TOKEN: ${{ secrets.VSUM_GIT_TOKEN }}
        run: |
          ansible-playbook -i environments/dev/hosts.ini playbooks/deploy-core.yml

      # DEV twin of the T620 (HAOS VM on this laptop): add-ons, then homeassistant/packages.
      - name: Home Assistant add-ons and packages
        env:
          GH_TOKEN: ${{ github.token }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_SSH_PRIV: ${{ secrets.HA_SSH_PRIV }}
          HA_ADMIN_PASSWORD: ${{ secrets.HA_ADMIN_PASSWORD }}
        run: |
          ./utils/dev-haos-vm.sh
          python3 utils/ha.py --env dev bootstrap
          python3 utils/ha.py --env dev deploy

  post-deploy-tests:
    needs: deploy-dev
    runs-on: [self-hosted, homelab-dev]
    timeout-minutes: 15
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

      - name: Run test suites
        env:
          HOMELAB_ENV: dev
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          SAMBA_ADMIN_PASSWORD: ${{ secrets.SAMBA_ADMIN_PASSWORD }}
          SAMBA_USER1_PASSWORD: ${{ secrets.SAMBA_USER1_PASSWORD }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          HOMARR_SECRET_KEY: ${{ secrets.HOMARR_SECRET_KEY }}
          LINKWARDEN_SECRET: ${{ secrets.LINKWARDEN_SECRET }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: ./utils/run-tests.sh --env dev --suite all --json-out tests-dev-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-dev-report
          path: tests-dev-report.json
          if-no-files-found: ignore
