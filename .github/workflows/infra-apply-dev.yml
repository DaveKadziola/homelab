name: Infra Apply Dev

on:
  push:
    branches: [homelab-v2]
  workflow_dispatch:

jobs:
  apply:
    runs-on: [self-hosted, homelab-dev]
    environment: dev
    env:
      TF_WORKSPACE: homelab-dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure nested Proxmox VM is running
        run: ./utils/ensure-dev-proxmox.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        # Its download has no timeout: a stalled HashiCorp request once held a runner for 20 min.
        timeout-minutes: 5
        with:
          # Same version as the laptop (utils/dev-apply-local.sh, tests) - one state, one version.
          terraform_version: 1.16.3
          # The wrapper is a Node script run with the host's node (ci-runner has none); unused here.
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform apply (state in HCP Terraform workspace homelab-dev)
        working-directory: terraform
        env:
          TF_VAR_environment: dev
          TF_VAR_proxmox_node_name: dev
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ vars.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_proxmox_ssh_username: ${{ vars.PROXMOX_SSH_USERNAME }}
          TF_VAR_proxmox_ssh_password: ${{ secrets.PROXMOX_SSH_PASSWORD }}
          TF_VAR_ubuntu_docker_password: ${{ secrets.UBUNTU_DOCKER_PASSWORD }}
          TF_VAR_ubuntu_docker_ssh_pub: ${{ vars.UBUNTU_DOCKER_SSH_PUB }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var-file=environments/dev/terraform.tfvars
