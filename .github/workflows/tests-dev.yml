name: Tests Dev

# Verification of DEV when this push does not deploy. A push that changes a deploy
# path is tested by post-deploy-tests in Apps Deploy Dev, after that deploy succeeds.
# A workflow_run trigger here ran as the default branch main, which environment dev rejects.

on:
  # TEMP: homelab-v2 until it is renamed to develop; drop it in the cleanup PR after the rename.
  push:
    branches: [homelab-v2, develop]
    paths:
      - "tests/**"
      - "utils/run-tests.sh"
      - ".github/workflows/tests-dev.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        default: all
        options: [all, smoke, infra, net, config, storage]

concurrency:
  group: tests-dev
  cancel-in-progress: false

jobs:
  tests:
    runs-on: [self-hosted, homelab-dev]
    timeout-minutes: 15
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same paths as on.push.paths in apps-deploy-dev.yml. A push of both starts
      # that workflow; testing here would compare the host before the copy lands.
      - name: Skip when this push also deploys
        id: deploy
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$before" "${{ github.sha }}")"
          if printf '%s\n' "$files" | grep -Eq '^(ansible/(playbooks/|environments/|ansible\.cfg)|compose/(core|grocery)/|config/(storage|identities|services|monitoring)\.yml|utils/bootstrap/|utils/backup/|utils/gen-proxy-config\.py|utils/gen-homarr-board\.sh|homeassistant/|utils/ha\.py|utils/dev-haos-vm\.sh|\.github/workflows/apps-deploy-dev\.yml)'; then
            echo "This push also starts Apps Deploy Dev. Tests run there after the deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Terraform
        if: steps.deploy.outputs.skip != 'true'
        # Installed on the runners (laptop: apt package terraform; ci-runner: utils/pve-ci-runner-lxc.sh),
        # not downloaded per job: the setup-terraform download stalled again and again.
        run: v="$(terraform version | head -1)"; echo "$v"; test "$v" = "Terraform v1.16.3"

      - name: Run test suites
        if: steps.deploy.outputs.skip != 'true'
        env:
          # The infra suite compares the rendered .env against the host, so it
          # needs the same secrets the deploy uses.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          SAMBA_ADMIN_PASSWORD: ${{ secrets.SAMBA_ADMIN_PASSWORD }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ vars.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_proxmox_ssh_username: ${{ vars.PROXMOX_SSH_USERNAME }}
          TF_VAR_proxmox_ssh_password: ${{ secrets.PROXMOX_SSH_PASSWORD }}
          TF_VAR_ubuntu_docker_password: ${{ secrets.UBUNTU_DOCKER_PASSWORD }}
          TF_VAR_ubuntu_docker_ssh_pub: ${{ vars.UBUNTU_DOCKER_SSH_PUB }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: |
          ./utils/run-tests.sh \
            --env dev \
            --suite "${{ inputs.suite || 'all' }}" \
            --json-out tests-dev-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-dev-report
          path: tests-dev-report.json
          if-no-files-found: ignore
