name: Tests Dev

# F7-C — automated verification of the dev environment.
# Runs when tests or config change, and on demand. After a deploy the tests run in the
# post-deploy-tests job of Apps Deploy Dev; a workflow_run trigger here ran on the default
# branch main, which environment dev rejects.

on:
  push:
    branches: [homelab-v2]
    paths:
      - "tests/**"
      - "utils/run-tests.sh"
      - "config/services.yml"
      - "config/identities.yml"
      - "config/storage.yml"
      - ".github/workflows/tests-dev.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        default: all
        options: [all, smoke, infra, net, config, storage]

concurrency:
  group: tests-dev
  cancel-in-progress: false

jobs:
  tests:
    runs-on: [self-hosted, homelab-dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3

      - name: Run test suites
        env:
          # The infra suite compares the rendered .env against the host, so it
          # needs the same secrets the deploy uses.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          SAMBA_ADMIN_PASSWORD: ${{ secrets.SAMBA_ADMIN_PASSWORD }}
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ vars.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_proxmox_ssh_username: ${{ vars.PROXMOX_SSH_USERNAME }}
          TF_VAR_proxmox_ssh_password: ${{ secrets.PROXMOX_SSH_PASSWORD }}
          TF_VAR_ubuntu_docker_password: ${{ secrets.UBUNTU_DOCKER_PASSWORD }}
          TF_VAR_ubuntu_docker_ssh_pub: ${{ vars.UBUNTU_DOCKER_SSH_PUB }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: |
          ./utils/run-tests.sh \
            --env dev \
            --suite "${{ inputs.suite || 'all' }}" \
            --json-out tests-dev-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-dev-report
          path: tests-dev-report.json
          if-no-files-found: ignore
