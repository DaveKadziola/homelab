name: Infra Plan Dev

# On pull requests to homelab-v2, so the plan is seen before the merge; Infra Apply Dev runs on the
# push after it. Both used to start on the same push and the plan often ran after the apply, so it
# always showed "No changes". Environment dev-plan, not dev: dev allows only homelab-v2 and rejects
# pull request refs (refs/pull/N/merge). dev-plan holds a read-only (PVEAuditor) token -
# docs/dev-proxmox.md "PR plan".
on:
  pull_request:
    branches: [homelab-v2]
  workflow_dispatch:

jobs:
  plan:
    runs-on: [self-hosted, homelab-dev]
    environment: dev-plan
    env:
      TF_WORKSPACE: homelab-dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure nested Proxmox VM is running
        run: ./utils/ensure-dev-proxmox.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Same version as the laptop (utils/dev-apply-local.sh, tests) - one state, one version.
          terraform_version: 1.16.3
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform plan (state in HCP Terraform workspace homelab-dev)
        working-directory: terraform
        env:
          TF_VAR_environment: dev
          TF_VAR_proxmox_node_name: dev
          TF_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ vars.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_proxmox_ssh_username: ${{ vars.PROXMOX_SSH_USERNAME }}
          # Plan does not connect over SSH, but the provider rejects an empty password.
          TF_VAR_proxmox_ssh_password: unused-by-plan
          TF_VAR_ubuntu_docker_password: ${{ secrets.UBUNTU_DOCKER_PASSWORD }}
          TF_VAR_ubuntu_docker_ssh_pub: ${{ vars.UBUNTU_DOCKER_SSH_PUB }}
        run: |
          terraform init -input=false
          # No lock: a plan writes no state and must never block Infra Apply Dev. No refresh: the
          # read-only token cannot read VM disks (VM.Config.Disk) - same as Infra Plan Prod.
          terraform plan -input=false -lock=false -refresh=false \
            -var-file=environments/dev/terraform.tfvars
