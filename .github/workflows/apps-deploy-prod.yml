name: Apps Deploy Prod

on:
  push:
    branches: [main]
    paths:
      - "compose/**"
      - "ansible/**"
      - ".github/workflows/apps-deploy-prod.yml"
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: [self-hosted, homelab-prod]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping ubuntu-apps
        working-directory: ansible
        run: ansible-playbook -i environments/prod/hosts.ini playbooks/ping.yml

      - name: Deploy compose/core
        working-directory: ansible
        env:
          HOMELAB_ENV: prod
          LINKWARDEN_URL: http://192.168.50.30:3001
          JELLYFIN_URL: http://192.168.50.30:8096
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          GROCERY_DB_PASSWORD: ${{ secrets.GROCERY_DB_PASSWORD }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          PORTAINER_ADMIN_PASSWORD: ${{ secrets.PORTAINER_ADMIN_PASSWORD }}
          HOMARR_ADMIN_PASSWORD: ${{ secrets.HOMARR_ADMIN_PASSWORD }}
          HOMARR_SECRET_KEY: ${{ secrets.HOMARR_SECRET_KEY }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          AUTHELIA_JWT_SECRET: ${{ secrets.AUTHELIA_JWT_SECRET }}
          AUTHELIA_SESSION_SECRET: ${{ secrets.AUTHELIA_SESSION_SECRET }}
          AUTHELIA_STORAGE_KEY: ${{ secrets.AUTHELIA_STORAGE_KEY }}
          LINKWARDEN_ADMIN_PASSWORD: ${{ secrets.LINKWARDEN_ADMIN_PASSWORD }}
          LINKWARDEN_SECRET: ${{ secrets.LINKWARDEN_SECRET }}
          IMMICH_ADMIN_PASSWORD: ${{ secrets.IMMICH_ADMIN_PASSWORD }}
          JELLYFIN_ADMIN_PASSWORD: ${{ secrets.JELLYFIN_ADMIN_PASSWORD }}
          NAVIDROME_ADMIN_PASSWORD: ${{ secrets.NAVIDROME_ADMIN_PASSWORD }}
          SYNCTHING_ADMIN_PASSWORD: ${{ secrets.SYNCTHING_ADMIN_PASSWORD }}
          BESZEL_ADMIN_PASSWORD: ${{ secrets.BESZEL_ADMIN_PASSWORD }}
          BESZEL_KEY: ${{ secrets.BESZEL_KEY }}
        run: |
          ansible-playbook -i environments/prod/hosts.ini playbooks/deploy-core.yml

      - name: Deploy NFS exports + backup timer
        working-directory: ansible
        env:
          HOMELAB_ENV: prod
        run: |
          ansible-playbook -i environments/prod/hosts.ini playbooks/deploy-storage.yml

  # F7-C — a deploy is not done until its tests are green. Checks that need a
  # part of prod that is not online yet report SKIP, which is not a failure.
  post-deploy-tests:
    needs: deploy-prod
    runs-on: [self-hosted, homelab-prod]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suites
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          LINKWARDEN_URL: http://192.168.50.30:3001
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: |
          ./utils/run-tests.sh --env prod --suite all --json-out tests-prod-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-prod-report
          path: tests-prod-report.json
          if-no-files-found: ignore
