name: Apps Deploy Prod

# After Infra Apply Prod, never next to it: on a push to main both used to start at once and
# the deploy raced the VMs it needs.
on:
  workflow_run:
    workflows: ["Infra Apply Prod"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # One click for the whole run. deploy-prod and the tests use prod for secrets only.
  approve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, homelab-prod]
    timeout-minutes: 5
    environment: prod-approve
    steps:
      - name: Approved
        run: echo "prod pipeline approved"

  deploy-prod:
    needs: approve
    if: needs.approve.result == 'success'
    runs-on: [self-hosted, homelab-prod]
    timeout-minutes: 120
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the prod SSH key
        # Inventory and tests use ~/.ssh/homelab_prod_ed25519 (user ubuntu-prod, made by Terraform).
        env:
          KEY: ${{ secrets.UBUNTU_DOCKER_SSH_PRIV }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/homelab_prod_ed25519
          chmod 600 ~/.ssh/homelab_prod_ed25519

      - name: Ping ubuntu-apps and ubuntu-nas
        working-directory: ansible
        run: ansible-playbook -i environments/prod/hosts.ini playbooks/ping.yml

      # Storage first: NFS must be mounted before compose binds the media libraries.
      - name: Deploy NFS exports + backup timer
        working-directory: ansible
        env:
          HOMELAB_ENV: prod
          SAMBA_ADMIN_PASSWORD: ${{ secrets.SAMBA_ADMIN_PASSWORD }}
          # NAS backup jobs (run-nas.sh, check-fresh.py); an empty value is not written.
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_SSH_PRIV: ${{ secrets.HA_SSH_PRIV }}
          HA_BACKUP_PASSWORD: ${{ secrets.HA_BACKUP_PASSWORD }}
          KUMA_PUSH_SECRET: ${{ secrets.KUMA_PUSH_SECRET }}
          OPNSENSE_BACKUP_SSH_PRIV: ${{ secrets.OPNSENSE_BACKUP_SSH_PRIV }}
        run: |
          ansible-playbook -i environments/prod/hosts.ini playbooks/deploy-storage.yml

      # After deploy-storage: the NAS must export backups/vzdump before Proxmox mounts it.
      - name: Proxmox backup job (VM dumps onto the NAS)
        # The prod token's right to create storage and backup jobs (Datastore.Allocate, Sys.Modify) was
        # not checked before the first run: a refusal must not stop the app deploy; the vzdump stream
        # then turns STALE in Uptime Kuma.
        continue-on-error: true
        env:
          PROXMOX_API_URL: ${{ vars.PROXMOX_API_URL }}
          PROXMOX_API_TOKEN_ID: ${{ vars.PROXMOX_API_TOKEN_ID }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: python3 utils/pve-backup-job.py --env prod

      - name: Deploy compose/core
        working-directory: ansible
        env:
          HOMELAB_ENV: prod
          LINKWARDEN_URL: http://192.168.50.30:3001
          JELLYFIN_URL: http://192.168.50.30:8096
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          GROCERY_DB_PASSWORD: ${{ secrets.GROCERY_DB_PASSWORD }}
          GROCERY_SECRET_KEY: ${{ secrets.GROCERY_SECRET_KEY }}
          GROCERY_ADMIN_PASSWORD: ${{ secrets.GROCERY_ADMIN_PASSWORD }}
          GROCERY_PROTON_SMTP_TOKEN: ${{ secrets.GROCERY_PROTON_SMTP_TOKEN }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          PORTAINER_ADMIN_PASSWORD: ${{ secrets.PORTAINER_ADMIN_PASSWORD }}
          HOMARR_ADMIN_PASSWORD: ${{ secrets.HOMARR_ADMIN_PASSWORD }}
          HOMARR_SECRET_KEY: ${{ secrets.HOMARR_SECRET_KEY }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          AUTHELIA_JWT_SECRET: ${{ secrets.AUTHELIA_JWT_SECRET }}
          AUTHELIA_SESSION_SECRET: ${{ secrets.AUTHELIA_SESSION_SECRET }}
          AUTHELIA_STORAGE_KEY: ${{ secrets.AUTHELIA_STORAGE_KEY }}
          LINKWARDEN_ADMIN_PASSWORD: ${{ secrets.LINKWARDEN_ADMIN_PASSWORD }}
          LINKWARDEN_SECRET: ${{ secrets.LINKWARDEN_SECRET }}
          IMMICH_ADMIN_PASSWORD: ${{ secrets.IMMICH_ADMIN_PASSWORD }}
          JELLYFIN_ADMIN_PASSWORD: ${{ secrets.JELLYFIN_ADMIN_PASSWORD }}
          NAVIDROME_ADMIN_PASSWORD: ${{ secrets.NAVIDROME_ADMIN_PASSWORD }}
          SYNCTHING_ADMIN_PASSWORD: ${{ secrets.SYNCTHING_ADMIN_PASSWORD }}
          BESZEL_ADMIN_PASSWORD: ${{ secrets.BESZEL_ADMIN_PASSWORD }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          # Alert mail and the proxy certificate; empty until the owner adds them (decisions 0006, 0007).
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ansible-playbook -i environments/prod/hosts.ini playbooks/deploy-core.yml

      # T620: add-ons, then homeassistant/packages (knowledge/apps/homeassistant.md). The first deploy
      # adds the packages include to configuration.yaml and restarts Home Assistant once.
      - name: Home Assistant add-ons and packages
        env:
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_SSH_PRIV: ${{ secrets.HA_SSH_PRIV }}
        run: |
          if [ -z "$HA_TOKEN" ]; then echo "::warning::HA_TOKEN is not set in environment prod - Home Assistant left alone"; exit 0; fi
          python3 utils/ha.py --env prod bootstrap
          python3 utils/ha.py --env prod deploy

  # F7-C — a deploy is not done until its tests are green. Checks that need a
  # part of prod that is not online yet report SKIP, which is not a failure.
  post-deploy-tests:
    needs: deploy-prod
    runs-on: [self-hosted, homelab-prod]
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the prod SSH key
        # Inventory and tests use ~/.ssh/homelab_prod_ed25519 (user ubuntu-prod, made by Terraform).
        env:
          KEY: ${{ secrets.UBUNTU_DOCKER_SSH_PRIV }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/homelab_prod_ed25519
          chmod 600 ~/.ssh/homelab_prod_ed25519

      - name: Run test suites
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMMICH_DB_PASSWORD: ${{ secrets.IMMICH_DB_PASSWORD }}
          SAMBA_ADMIN_PASSWORD: ${{ secrets.SAMBA_ADMIN_PASSWORD }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          LINKWARDEN_URL: http://192.168.50.30:3001
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: |
          ./utils/run-tests.sh --env prod --suite all --json-out tests-prod-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-prod-report
          path: tests-prod-report.json
          if-no-files-found: ignore
