---
# Deploy compose/core to ubuntu_docker (dev or prod inventory).
- name: Deploy homelab core stack
  hosts: ubuntu_docker
  become: true
  vars:
    compose_src: "{{ playbook_dir }}/../../compose/core"
    compose_dest: /opt/homelab/compose/core
    grocery_src: "{{ playbook_dir }}/../../compose/grocery"
    grocery_dest: /opt/homelab/compose/grocery
    utils_src: "{{ playbook_dir }}/../../utils"
    config_src: "{{ playbook_dir }}/../../config"
    homelab_root: /opt/homelab
    secrets_dest: /opt/homelab/secrets
    homelab_env: "{{ lookup('env', 'HOMELAB_ENV') | default('dev', true) }}"
    # Values come from the environment, else from the per-env cache that
    # utils/gen-app-credentials.sh writes on the operator machine.
    secret_cache: "{{ lookup('env', 'HOME') }}/.homelab-secrets/{{ homelab_env }}"
    identities: "{{ lookup('file', config_src + '/identities.yml') | from_yaml }}"
    # homelab-admin declares `email: environment`, so it resolves to the mailbox
    # of the target environment — same rule as utils/gen-app-credentials.sh.
    pgadmin_email: "{{ identities.environment_email[homelab_env] }}"
    # Names declared in config/identities.yml — the values never live in git.
    homelab_secrets:
      - POSTGRES_PASSWORD
      - IMMICH_DB_PASSWORD
      - GROCERY_DB_PASSWORD
      - PGADMIN_PASSWORD
      - PORTAINER_ADMIN_PASSWORD
      - HOMARR_ADMIN_PASSWORD
      - HOMARR_SECRET_KEY
      - AUTHELIA_ADMIN_PASSWORD
      - AUTHELIA_JWT_SECRET
      - AUTHELIA_SESSION_SECRET
      - AUTHELIA_STORAGE_KEY
      - LINKWARDEN_ADMIN_PASSWORD
      - LINKWARDEN_SECRET
      - IMMICH_ADMIN_PASSWORD
      - JELLYFIN_ADMIN_PASSWORD
      - NAVIDROME_ADMIN_PASSWORD
      - SYNCTHING_ADMIN_PASSWORD
      - BESZEL_ADMIN_PASSWORD
      - BESZEL_KEY
    postgres_password: "{{ resolved_secrets.POSTGRES_PASSWORD }}"
    immich_db_password: "{{ resolved_secrets.IMMICH_DB_PASSWORD | default(postgres_password, true) }}"
    compose_profiles: "{{ lookup('env', 'COMPOSE_PROFILES') | default('auth,media', true) }}"
    run_bootstrap: "{{ lookup('env', 'HOMELAB_SKIP_BOOTSTRAP') | default('', true) | length == 0 }}"
    # Prod binds Immich/Jellyfin/Navidrome libraries to NFS. Never on DEV —
    # that would hide the existing named volumes (Immich photos).
    compose_file_args: >-
      -f {{ compose_dest }}/docker-compose.yml
      {% if homelab_env == 'prod' %}-f {{ compose_dest }}/docker-compose.nfs.yml{% endif %}
  tasks:
    - name: Resolve secrets from the environment or the operator secret cache
      ansible.builtin.set_fact:
        resolved_secrets: >-
          {{ resolved_secrets | default({}) | combine({
               item: lookup('env', item)
                     | default(lookup('file', secret_cache ~ '/' ~ item, errors='ignore'), true)
                     | default('', true)
             }) }}
      loop: "{{ homelab_secrets }}"
      no_log: true

    - name: Require POSTGRES_PASSWORD
      ansible.builtin.assert:
        that:
          - postgres_password | length > 0
        fail_msg: >-
          Set POSTGRES_PASSWORD in the environment, or generate it with
          utils/gen-app-credentials.sh --env {{ homelab_env }} --all

    - name: Require application secrets that have no safe default
      ansible.builtin.assert:
        that:
          - resolved_secrets.HOMARR_SECRET_KEY | length > 0
          - resolved_secrets.LINKWARDEN_SECRET | length > 0
          - resolved_secrets.PGADMIN_PASSWORD | length > 0
        fail_msg: >-
          Generate missing secrets with
          utils/gen-app-credentials.sh --env {{ homelab_env }} --all

    - name: Ensure compose directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0755"
      loop:
        - "{{ compose_dest }}"
        - "{{ compose_dest }}/authelia"
        - "{{ compose_dest }}/zotify"
        - "{{ compose_dest }}/diun"
        - "{{ compose_dest }}/pgadmin"
        - "{{ compose_dest }}/navidrome"
        - "{{ compose_dest }}/immich"
        - "{{ compose_dest }}/homarr"
        - "{{ grocery_dest }}"
        - "{{ homelab_root }}/config"
        - "{{ homelab_root }}/utils"

    - name: Sync core docker-compose.yml
      ansible.builtin.copy:
        src: "{{ compose_src }}/docker-compose.yml"
        dest: "{{ compose_dest }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"

    - name: Sync the prod NFS compose override
      ansible.builtin.copy:
        src: "{{ compose_src }}/docker-compose.nfs.yml"
        dest: "{{ compose_dest }}/docker-compose.nfs.yml"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"

    - name: Sync Authelia config
      ansible.builtin.copy:
        src: "{{ compose_src }}/authelia/"
        dest: "{{ compose_dest }}/authelia/"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"

    - name: Ensure Authelia certs directory
      ansible.builtin.file:
        path: "{{ compose_dest }}/authelia/certs"
        state: directory
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0750"

    - name: Generate DEV Authelia self-signed TLS cert
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -newkey rsa:2048 -days 825
          -keyout {{ compose_dest }}/authelia/certs/key.pem
          -out {{ compose_dest }}/authelia/certs/cert.pem
          -subj /CN=authelia.homelab.local
          -addext subjectAltName=DNS:authelia.homelab.local,DNS:homelab.local,DNS:*.homelab.local,IP:192.168.122.50
        creates: "{{ compose_dest }}/authelia/certs/cert.pem"

    - name: Fix Authelia cert permissions
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"
      loop:
        - "{{ compose_dest }}/authelia/certs/cert.pem"
        - "{{ compose_dest }}/authelia/certs/key.pem"

    - name: Sync Zotify Dockerfile
      ansible.builtin.copy:
        src: "{{ compose_src }}/zotify/Dockerfile"
        dest: "{{ compose_dest }}/zotify/Dockerfile"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"

    - name: Sync Diun config
      ansible.builtin.copy:
        src: "{{ compose_src }}/diun/diun.yml"
        dest: "{{ compose_dest }}/diun/diun.yml"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"

    - name: Sync application config as code (pgAdmin servers, Navidrome, Immich, Homarr board)
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"
      loop:
        - { src: "{{ compose_src }}/pgadmin/servers.json", dest: "{{ compose_dest }}/pgadmin/servers.json" }
        - { src: "{{ compose_src }}/navidrome/navidrome.toml", dest: "{{ compose_dest }}/navidrome/navidrome.toml" }
        - { src: "{{ compose_src }}/immich/system-config.json", dest: "{{ compose_dest }}/immich/system-config.json" }
        - { src: "{{ compose_src }}/homarr/board-{{ homelab_env }}.json", dest: "{{ compose_dest }}/homarr/board-{{ homelab_env }}.json" }
      loop_control:
        label: "{{ item.dest }}"

    - name: Sync grocery compose (bridge + published ports)
      ansible.builtin.copy:
        src: "{{ grocery_src }}/docker-compose.yml"
        dest: "{{ grocery_dest }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0644"

    - name: Write .env
      ansible.builtin.copy:
        dest: "{{ compose_dest }}/.env"
        owner: "{{ ansible_user }}"
        group: docker
        mode: "0640"
        content: |
          POSTGRES_PASSWORD={{ postgres_password }}
          PGADMIN_EMAIL={{ lookup('env', 'PGADMIN_EMAIL') | default(pgadmin_email, true) }}
          PGADMIN_PASSWORD={{ resolved_secrets.PGADMIN_PASSWORD | default(postgres_password, true) }}
          HOMARR_SECRET_KEY={{ resolved_secrets.HOMARR_SECRET_KEY }}
          LINKWARDEN_SECRET={{ resolved_secrets.LINKWARDEN_SECRET }}
          LINKWARDEN_URL={{ lookup('env', 'LINKWARDEN_URL') | default('http://127.0.0.1:3001', true) }}
          NAVIDROME_ADMIN_PASSWORD={{ resolved_secrets.NAVIDROME_ADMIN_PASSWORD | default(postgres_password, true) }}
          AUTHELIA_JWT_SECRET={{ resolved_secrets.AUTHELIA_JWT_SECRET | default(postgres_password, true) }}
          AUTHELIA_SESSION_SECRET={{ resolved_secrets.AUTHELIA_SESSION_SECRET | default(postgres_password, true) }}
          AUTHELIA_STORAGE_KEY={{ resolved_secrets.AUTHELIA_STORAGE_KEY | default(postgres_password, true) }}
          COMPOSE_PROFILES={{ compose_profiles }}
          IMMICH_DB_PASSWORD={{ immich_db_password }}
          IMMICH_VERSION={{ lookup('env', 'IMMICH_VERSION') | default('v3', true) }}
          JELLYFIN_URL={{ lookup('env', 'JELLYFIN_URL') | default('http://192.168.122.50:8096', true) }}
          BESZEL_HUB_URL={{ lookup('env', 'BESZEL_HUB_URL') | default('http://127.0.0.1:8090', true) }}
          BESZEL_KEY={{ resolved_secrets.BESZEL_KEY | default('', true) }}
          BESZEL_TOKEN={{ lookup('env', 'BESZEL_TOKEN') | default('', true) }}
          ZOTIFY_USERNAME={{ lookup('env', 'ZOTIFY_USERNAME') | default('', true) }}
          ZOTIFY_TOKEN={{ lookup('env', 'ZOTIFY_TOKEN') | default('', true) }}
      no_log: true

    # The bootstrap scripts read secrets from here, so a re-run on the host
    # needs no environment. Root only, never synced back to git.
    - name: Ensure the host secret cache
      ansible.builtin.file:
        path: "{{ secrets_dest }}/{{ homelab_env }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the host secret cache
      ansible.builtin.copy:
        dest: "{{ secrets_dest }}/{{ homelab_env }}/{{ item }}"
        content: "{{ resolved_secrets[item] }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ homelab_secrets }}"
      when: resolved_secrets[item] | length > 0
      no_log: true

    - name: Sync declarative config (services + identities)
      ansible.builtin.copy:
        src: "{{ config_src }}/{{ item }}"
        dest: "{{ homelab_root }}/config/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - services.yml
        - identities.yml
        - storage.yml

    - name: Sync the bootstrap scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ homelab_root }}/utils/"
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ utils_src }}/bootstrap-apps.sh"
        - "{{ utils_src }}/bootstrap"
        - "{{ utils_src }}/backup"

    - name: Ensure docker compose plugin / v2 and the bootstrap dependencies
      ansible.builtin.apt:
        name:
          - docker-compose-v2
          - python3-yaml
          - python3-pexpect
          - jq
        state: present
        update_cache: true

    - name: Pull/build and start core stack
      ansible.builtin.command:
        cmd: docker compose {{ compose_file_args }} --env-file {{ compose_dest }}/.env up -d --build --remove-orphans
        chdir: "{{ compose_dest }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Running' in compose_up.stderr or compose_up.rc == 0"

    - name: Show running containers
      ansible.builtin.command: docker compose {{ compose_file_args }} --env-file {{ compose_dest }}/.env ps -a
      register: compose_ps
      changed_when: false

    - name: Print status
      ansible.builtin.debug:
        var: compose_ps.stdout_lines

    # F7-B: every app account and setting is converged here, not in a browser.
    # Apps behind a disabled compose profile report SKIP and do not fail the run.
    - name: Bootstrap application accounts and settings
      ansible.builtin.command:
        cmd: "{{ homelab_root }}/utils/bootstrap-apps.sh --env {{ homelab_env }} --host 127.0.0.1"
      environment:
        HOMELAB_SECRETS_DIR: "{{ secrets_dest }}"
        HOMELAB_CONFIG_DIR: "{{ homelab_root }}/config"
        HOMELAB_COMPOSE_DIR: "{{ homelab_root }}/compose"
      register: bootstrap_apps
      changed_when: "'converged' in bootstrap_apps.stdout"
      when: run_bootstrap | bool

    - name: Print the bootstrap table
      ansible.builtin.debug:
        var: bootstrap_apps.stdout_lines
      when: run_bootstrap | bool
