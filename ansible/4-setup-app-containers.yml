---
- hosts: ubuntu-docker
  become: true
  vars:
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    ubuntu_docker_password: "{{ lookup('env', 'UBUNTU_DOCKER_PASSWORD') }}"
    containers:
      #check depends on if possible
      - name: homarr
        image: ghcr.io/ajnart/homarr:latest
        ports:
          - "7575:7575"
        volumes:
          - /opt/homarr/configs:/app/data/configs
          - /opt/homarr/icons:/app/public/icons
      - name: linkwarden
        image: ghcr.io/linkwarden/linkwarden:latest
        ports:
          - "3030:3000"
        env:
          NEXTAUTH_SECRET: testsecret
          NEXTAUTH_URL: http://localhost:3030/api/v1/auth
          DATABASE_URL: postgres://linkwarden:{{ postgres_password }}@192.168.122.221:5432/linkwarden
      - name: fireflyiii
        image: fireflyiii/core:latest
        ports:
          - "8005:8080"
        env:
          DB_CONNECTION: pgsql
          DB_HOST: "192.168.122.221"
          DB_PORT: "5432"
          DB_DATABASE: firefly3
          DB_USERNAME: firefly3
          DB_PASSWORD: "{{ postgres_password }}"
          APP_KEY: "base64:UT6uInBzkq1/oZfpLpm1Fht6RuXSEMObxrsz7P7+28k=" #testkey
      - name: nginx-proxy-manager
        image: jc21/nginx-proxy-manager:latest
        ports:
          - "80:80"
          - "81:81"
          - "443:443"
        volumes:
          - /opt/nginx-proxy-manager/data:/data
          - /opt/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      - name: syncthing
        image: syncthing/syncthing:latest
        ports:
          - "8384:8384"
          - "22000:22000/tcp"
          - "21027:21027/udp"
  #       volumes:
  #         - /opt/syncthing:/var/syncthing
  #     - name: easytodo-grocery
  #       build:
  #         context: /opt/easytodo-grocery
  #       ports:
  #         - "8082:8080"
  #       env:
  #         DATABASE_URL: postgres://easytodo:{{ postgres_password }}@postgres:5432/easytodo

  tasks:
    - name: Pull and run all defined containers
      community.docker.docker_container:
        name: "{{ item.name }}"
        image: "{{ item.image | default(omit) }}"
        build: "{{ item.build | default(omit) }}"
        ports: "{{ item.ports | default(omit) }}"
        volumes: "{{ item.volumes | default(omit) }}"
        env: "{{ item.env | default(omit) }}"
        restart_policy: always
        state: started
      loop: "{{ containers }}"
