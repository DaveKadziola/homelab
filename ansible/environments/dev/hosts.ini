# Dev — ubuntu-apps-dev from Terraform (nested Proxmox)
# No second NAS VM (RAM). ubuntu_nas is the same guest: local export + loopback NFS.
[ubuntu_docker]
ubuntu-apps-dev ansible_host=192.168.122.50 ansible_user=ubuntu-dev ansible_ssh_private_key_file=~/.ssh/homelab_dev_ed25519

[ubuntu_nas]
ubuntu-apps-dev ansible_host=192.168.122.50 ansible_user=ubuntu-dev ansible_ssh_private_key_file=~/.ssh/homelab_dev_ed25519

[all:children]
ubuntu_docker
ubuntu_nas
