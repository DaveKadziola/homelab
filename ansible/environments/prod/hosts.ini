# Prod — ubuntu-apps on APP VLAN (F3); ubuntu-nas on IOT (F5)
[ubuntu_docker]
ubuntu-apps ansible_host=192.168.50.30 ansible_user=ubuntu-prod ansible_ssh_private_key_file=~/.ssh/homelab_prod_ed25519 ansible_python_interpreter=/usr/bin/python3

[ubuntu_nas]
ubuntu-nas ansible_host=192.168.20.12 ansible_user=ubuntu-prod ansible_ssh_private_key_file=~/.ssh/homelab_prod_ed25519 ansible_python_interpreter=/usr/bin/python3

[all:children]
ubuntu_docker
ubuntu_nas
