# Diun — watch local Docker images; DEV logs to stdout (no Gotify/Discord required).
# Docs: https://crazymax.dev/diun/
watch:
  workers: 5
  schedule: "0 */6 * * *"
  firstCheckNotif: false

# Compose pins exact versions (S5), so also list newer release tags of each repo.
defaults:
  watchRepo: true
  sortTags: semver
  maxTags: 5
  includeTags:
    - '^v?\d+\.\d+\.\d+(-\d+)?$'

providers:
  docker:
    watchByDefault: true
    watchStopped: false

# No notifiers configured → Diun still runs and logs new tags to container stdout.
# Optional later: Gotify / Discord via env DIUN_NOTIF_* in .env
