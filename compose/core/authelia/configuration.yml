---
# Authelia behind Caddy (decision 0007) — file-backed users, portal https://auth.<domain>.
# Login: user `admin` — the argon2id hash lives in users_database.yml and is
#   written by utils/bootstrap/authelia.sh from AUTHELIA_ADMIN_PASSWORD.
# Caddy terminates TLS and asks /api/authz/forward-auth for every app name; plain HTTP here.
# Per env (session cookie domain, access rules): access.yml, generated by
#   utils/gen-proxy-config.py and loaded through X_AUTHELIA_CONFIG.
#
# No key material in this file. Compose injects, from the secret cache:
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET  (AUTHELIA_JWT_SECRET)
#   AUTHELIA_SESSION_SECRET                                 (AUTHELIA_SESSION_SECRET)
#   AUTHELIA_STORAGE_ENCRYPTION_KEY                         (AUTHELIA_STORAGE_KEY)

theme: auto

server:
  address: 'tcp://:9091'

log:
  level: info

totp:
  disable: true

authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
