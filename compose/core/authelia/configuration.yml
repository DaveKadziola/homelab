---
# DEV Authelia — file-backed users, TLS portal on host :9091
# Login: user `admin` — the argon2id hash lives in users_database.yml and is
#   written by utils/bootstrap/authelia.sh from AUTHELIA_ADMIN_PASSWORD.
# Access: https://192.168.122.50:9091  (self-signed) or
#         https://authelia.homelab.local:9091  (add /etc/hosts → 192.168.122.50)
# Authelia 4.39 requires HTTPS for session cookie URLs.
#
# No key material in this file. Compose injects, from the secret cache:
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET  (AUTHELIA_JWT_SECRET)
#   AUTHELIA_SESSION_SECRET                                 (AUTHELIA_SESSION_SECRET)
#   AUTHELIA_STORAGE_ENCRYPTION_KEY                         (AUTHELIA_STORAGE_KEY)

theme: auto

server:
  address: 'tcp://:9091'
  tls:
    certificate: /config/certs/cert.pem
    key: /config/certs/key.pem

log:
  level: info

totp:
  disable: true

authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true

access_control:
  default_policy: one_factor
  rules:
    - domain: '*.homelab.local'
      policy: one_factor
    - domain: 'homelab.local'
      policy: one_factor

session:
  cookies:
    - name: authelia_session
      domain: 'homelab.local'
      authelia_url: 'https://authelia.homelab.local:9091'
      expiration: 12h
      inactivity: 1h

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
