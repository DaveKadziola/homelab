# Core stack — P0 + P1 + P2 (F4).
# Dev: ubuntu-apps-dev @ 192.168.122.50 (nested PVE; see docs/f4-apps-dev.md RAM note)
# Prod: ubuntu-apps @ 192.168.50.30 (after F3)
#
# Grocery (public) is separate: compose/grocery via Portainer — see docs/f4-apps-dev.md
# Profiles: `auth` (Authelia), `media` (Immich + Jellyfin). Deploy enables both by default.

name: homelab-core

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homelab
      POSTGRES_DB: homelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for db in linkwarden firefly3 actual trilium grafana easytodo; do
          psql -h postgres -U homelab -d homelab -tc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            || psql -h postgres -U homelab -d homelab -c "CREATE DATABASE $$db"
          psql -h postgres -U homelab -d homelab -c "DO \$\$ BEGIN CREATE USER $$db WITH PASSWORD '${POSTGRES_PASSWORD}'; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;"
          psql -h postgres -U homelab -d $$db -c "GRANT ALL ON SCHEMA public TO $$db"
        done
    restart: "no"

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    mem_limit: 256m

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    mem_limit: 256m

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    ports:
      - "7575:7575"
    volumes:
      - homarr_data:/appdata
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    mem_limit: 512m

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m

  trilium:
    image: triliumnext/trilium:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - trilium_data:/home/node/trilium-data
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    mem_limit: 512m

  actual:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - actual_data:/data
    mem_limit: 512m

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD}@postgres:5432/linkwarden
      NEXTAUTH_SECRET: ${LINKWARDEN_SECRET:-homelab-dev-linkwarden-change-me}
      NEXTAUTH_URL: ${LINKWARDEN_URL:-http://192.168.122.50:3001}
    volumes:
      - linkwarden_data:/data/data
    mem_limit: 768m

  # Authelia — COMPOSE_PROFILES=auth (default on deploy)
  authelia:
    image: authelia/authelia:latest
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ./authelia:/config
    mem_limit: 256m
    profiles: ["auth"]

  omni-tools:
    image: iib0011/omni-tools:latest
    restart: unless-stopped
    ports:
      - "8083:80"
    mem_limit: 256m

  dumbwhois:
    image: dumbwareio/dumbwhois:latest
    restart: unless-stopped
    ports:
      - "8084:3000"
    mem_limit: 128m

  bentopdf:
    image: ghcr.io/alam00000/bentopdf:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    mem_limit: 256m

  # --- P1 ---
  syncthing:
    image: syncthing/syncthing:latest
    restart: unless-stopped
    hostname: syncthing-dev
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - syncthing_data:/var/syncthing
    environment:
      PUID: "1000"
      PGID: "1000"
    mem_limit: 256m

  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      - navidrome_data:/data
      - navidrome_music:/music:ro
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    mem_limit: 256m

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - jellyfin_media:/media
    environment:
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL:-http://192.168.122.50:8096}
    # DEV: no HW transcode; keep footprint small
    mem_limit: 768m
    profiles: ["media"]

  # Immich — own Postgres + Valkey; DEV uses local Docker volumes (not NFS SA500)
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - immich_upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_HOST: 0.0.0.0
      IMMICH_PORT: 2283
    depends_on:
      immich-redis:
        condition: service_started
      immich-postgres:
        condition: service_started
    mem_limit: 768m
    profiles: ["media"]

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    restart: unless-stopped
    volumes:
      - immich_model_cache:/cache
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    depends_on:
      - immich-server
    mem_limit: 768m
    profiles: ["media"]

  immich-redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    profiles: ["media"]

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    mem_limit: 512m
    profiles: ["media"]

  # --- P2 ---
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - beszel_data:/beszel_data
    mem_limit: 128m

  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: "45876"
      HUB_URL: ${BESZEL_HUB_URL:-http://127.0.0.1:8090}
      # After first hub login, paste public KEY (and TOKEN if required) into host .env
      KEY: ${BESZEL_KEY:-}
      TOKEN: ${BESZEL_TOKEN:-}
    mem_limit: 64m

  diun:
    image: crazymax/diun:latest
    restart: unless-stopped
    command: serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./diun/diun.yml:/diun.yml:ro
      - diun_data:/data
    environment:
      TZ: UTC
      LOG_LEVEL: info
      DIUN_WATCH_WORKERS: "5"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
    mem_limit: 128m

  # Zotify — Spotify downloader helper (CLI). Stay-up container; exec in to use.
  # First login: docker exec -it homelab-core-zotify-1 zotify …
  # OAuth callback listens on host :4381 during login. Secrets stay in volume / local .env.
  zotify:
    build:
      context: ./zotify
      dockerfile: Dockerfile
    image: homelab-zotify:local
    restart: unless-stopped
    ports:
      - "4381:4381"
    environment:
      ZOTIFY_USERNAME: ${ZOTIFY_USERNAME:-}
      ZOTIFY_TOKEN: ${ZOTIFY_TOKEN:-}
    volumes:
      - zotify_music:/root/Music/Zotify Music
      - zotify_podcasts:/root/Music/Zotify Podcasts
      - zotify_config:/root/.zotify
    mem_limit: 512m

volumes:
  postgres_data:
  portainer_data:
  pgadmin_data:
  homarr_data:
  trilium_data:
  actual_data:
  linkwarden_data:
  syncthing_data:
  navidrome_data:
  navidrome_music:
  jellyfin_config:
  jellyfin_cache:
  jellyfin_media:
  immich_upload:
  immich_model_cache:
  immich_postgres:
  beszel_data:
  diun_data:
  zotify_music:
  zotify_podcasts:
  zotify_config:
