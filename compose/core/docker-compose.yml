# Core stack — P0 + P1 + P2 (F4).
# Dev: ubuntu-apps-dev @ 192.168.122.50 (nested PVE; see docs/f4-apps-dev.md RAM note)
# Prod: ubuntu-apps @ 192.168.50.30 (after F3)
#
# Grocery (public) is separate: compose/grocery via Portainer — see docs/f4-apps-dev.md
# Profiles: `auth` (Authelia), `media` (Immich + Jellyfin). Deploy enables both on DEV, only `media` on prod.

name: homelab-core

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homelab
      POSTGRES_DB: homelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Each probe is an exec through dockerd/containerd; on the J4205 apps VM probes every 5-10 s
    # cost ~20 % of a core at idle. start_interval keeps depends_on fast while the service starts.
    # -h 127.0.0.1: on a fresh volume the entrypoint's init server listens on the socket only and
    # must not count as ready, or postgres-init connects over TCP too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U homelab -d homelab"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    mem_limit: 512m

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for db in linkwarden firefly3 actual trilium grafana easytodo vsum; do
          psql -h postgres -U homelab -d homelab -tc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            || psql -h postgres -U homelab -d homelab -c "CREATE DATABASE $$db"
          psql -h postgres -U homelab -d homelab -c "DO \$\$ BEGIN CREATE USER $$db WITH PASSWORD '${POSTGRES_PASSWORD}'; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;"
          psql -h postgres -U homelab -d $$db -c "GRANT ALL ON SCHEMA public TO $$db"
        done
        # vsum fetches untrusted feeds and pages: its role gets its own password, not the admin one.
        psql -h postgres -U homelab -d homelab -c "ALTER ROLE vsum PASSWORD '${VSUM_DB_PASSWORD:?set VSUM_DB_PASSWORD}'"
    restart: "no"

  portainer:
    image: portainer/portainer-ce:2.45.2
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    mem_limit: 256m

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      # Address comes from config/identities.yml — never hardcoded here.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Server list as code — utils/bootstrap/pgadmin.sh reloads it on every run.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    # 256m hung :5050; 384m still OOM-kills gunicorn workers under load
    mem_limit: 512m

  homarr:
    image: ghcr.io/homarr-labs/homarr:v2.6.0
    restart: unless-stopped
    ports:
      - "7575:7575"
    volumes:
      - homarr_data:/appdata
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_KEY:?set HOMARR_SECRET_KEY}
    mem_limit: 512m

  dozzle:
    image: amir20/dozzle:v11.3.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m

  trilium:
    image: triliumnext/trilium:v0.106.0
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - trilium_data:/home/node/trilium-data
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    mem_limit: 512m

  actual:
    image: actualbudget/actual-server:26.10.0
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - actual_data:/data
    mem_limit: 512m

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD}@postgres:5432/linkwarden
      NEXTAUTH_SECRET: ${LINKWARDEN_SECRET:?set LINKWARDEN_SECRET}
      NEXTAUTH_URL: ${LINKWARDEN_URL:-http://192.168.122.50:3001}
    volumes:
      - linkwarden_data:/data/data
    mem_limit: 512m

  # Authelia — COMPOSE_PROFILES=auth (deploy default on DEV; off on prod, decision 0003)
  # Names + TLS in front of the apps (profile proxy, decision 0007). The Caddyfile is generated by
  # utils/gen-proxy-config.py at deploy; upstreams are the ports the apps publish on the host.
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: homelab-caddy:2.11.7-cloudflare-0.2.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # prod only: DNS challenge for the wildcard certificate; DEV uses Caddy's internal CA.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    profiles: ["proxy"]

  # Secrets come from the environment; configuration.yml holds no key material.
  # The admin hash in authelia/users_database.yml is written by
  # utils/bootstrap/authelia.sh. Session cookie and access rules per env: authelia/access.yml,
  # generated by utils/gen-proxy-config.py at deploy.
  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?set AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?set AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_KEY:?set AUTHELIA_STORAGE_KEY}
      X_AUTHELIA_CONFIG: /config/configuration.yml,/config/access.yml
      # entrypoint chowns /config to these; deploy-core sets the ansible user and the docker group
      PUID: ${AUTHELIA_PUID:-0}
      PGID: ${AUTHELIA_PGID:-0}
    volumes:
      - ./authelia:/config
    mem_limit: 256m
    profiles: ["auth"]

  omni-tools:
    image: iib0011/omni-tools:latest@sha256:ec5c71c92215ca20b5e7e613941ac603d43625604d02ff07c8e27b7a237980ac
    restart: unless-stopped
    ports:
      - "8083:80"
    mem_limit: 256m

  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    restart: unless-stopped
    ports:
      - "8086:80"
    mem_limit: 64m

  # Replaces DumbWhois: domain/IP/ASN lookups over RDAP, where port-43 WHOIS timed out for .com/.xyz.
  networking-toolbox:
    image: lissy93/networking-toolbox:1.6.0
    restart: unless-stopped
    ports:
      - "8087:3000"
    mem_limit: 256m

  bentopdf:
    image: ghcr.io/alam00000/bentopdf:v2.8.8
    restart: unless-stopped
    ports:
      - "8085:8080"
    mem_limit: 256m

  # --- P1 ---
  syncthing:
    image: syncthing/syncthing:2.1.6
    restart: unless-stopped
    hostname: syncthing-dev
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - syncthing_data:/var/syncthing
    environment:
      PUID: "1000"
      PGID: "1000"
    mem_limit: 256m

  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      - navidrome_data:/data
      - navidrome_music:/music:ro
      - ./navidrome/navidrome.toml:/etc/navidrome/navidrome.toml:ro
    environment:
      ND_CONFIGFILE: /etc/navidrome/navidrome.toml
      # Creates the `admin` user on first start — no web UI signup.
      ND_DEVAUTOCREATEADMINPASSWORD: ${NAVIDROME_ADMIN_PASSWORD:?set NAVIDROME_ADMIN_PASSWORD}
    mem_limit: 256m

  jellyfin:
    image: jellyfin/jellyfin:12.2.20261005-225228
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - jellyfin_media:/media
    environment:
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL:-http://192.168.122.50:8096}
    # DEV: no HW transcode; keep footprint small
    mem_limit: 512m
    profiles: ["media"]

  # Immich — own Postgres + Valkey; DEV uses local Docker volumes (not NFS SA500)
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.3}
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - immich_upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_HOST: 0.0.0.0
      IMMICH_PORT: 2283
    depends_on:
      immich-redis:
        condition: service_started
      immich-postgres:
        condition: service_healthy
    # Nested DEV can be tight; Immich API+microservices need headroom (1024m → exit 137)
    mem_limit: 1536m
    profiles: ["media"]

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.3}
    restart: unless-stopped
    volumes:
      - immich_model_cache:/cache
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    depends_on:
      - immich-server
    # Needs host CPU (x86-64-v2 / SSE4.2). Nested qemu64 breaks NumPy — set Proxmox CPU=host.
    mem_limit: 384m
    profiles: ["media"]

  immich-redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    profiles: ["media"]

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    # 512m OOMs during Immich geodata/metadata init on DEV → crash loop
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d immich"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Same value as the image's own healthcheck; covers the first initdb.
      start_period: 300s
      start_interval: 2s
    profiles: ["media"]

  # --- P2 ---
  beszel:
    image: henrygd/beszel:0.21.0
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - beszel_data:/beszel_data
    mem_limit: 128m

  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    # KEY + TOKEN: beszel-agent.env, written from the hub by utils/bootstrap/beszel.sh on the host (they
    # never leave it). Until the first bootstrap the agent exits and restarts.
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Keeps the agent fingerprint the hub pinned on first connect.
      - beszel_agent_data:/var/lib/beszel-agent
    environment:
      LISTEN: "45876"
      HUB_URL: ${BESZEL_HUB_URL:-http://127.0.0.1:8090}
    env_file:
      - path: ./beszel-agent.env
        required: false
    mem_limit: 64m
    profiles: ["beszel-agent"]

  diun:
    image: crazymax/diun:4.33.0
    restart: unless-stopped
    command: serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./diun/diun.yml:/diun.yml:ro
      - diun_data:/data
    environment:
      TZ: UTC
      LOG_LEVEL: info
      DIUN_WATCH_WORKERS: "5"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
    # Mail notifier (DIUN_NOTIF_MAIL_*), written by deploy-core.yml only when the env has an SMTP
    # relay (config/monitoring.yml); without the file Diun only logs new tags.
    env_file:
      - path: ./diun.env
        required: false
    # watchRepo lists every tag of each repo (immich-ml has thousands): 128m was OOM-killed
    # mid-scan on DEV (2026-10-19).
    mem_limit: 256m

  # vsum (profile vsum): video summaries. Image built on the host by deploy-core.yml from the private
  # repo at vsum_ref; never pushed to a registry. Archive: named volume on DEV, SA500 NFS on prod
  # (docker-compose.nfs.yml). API keys and the Trilium ETAPI token are optional: without them a video
  # fails with a clear error and the Trilium export stays off.
  vsum-web:
    <<: &vsum
      image: ${VSUM_IMAGE:?set VSUM_IMAGE}
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
        postgres-init:
          condition: service_completed_successfully
      environment:
        TZ: Europe/Warsaw
        VSUM_DATABASE_URL: postgresql+psycopg://vsum:${VSUM_DB_PASSWORD:?set VSUM_DB_PASSWORD}@postgres:5432/vsum
        VSUM_SECRET_KEY: ${VSUM_SECRET_KEY:?set VSUM_SECRET_KEY}
        VSUM_PUBLIC_URL: ${VSUM_PUBLIC_URL:-}
        VSUM_TRILIUM_URL: http://trilium:8080
        VSUM_TRILIUM_TOKEN: ${VSUM_TRILIUM_TOKEN:-}
        OPENROUTER_KEY: ${VSUM_OPENROUTER_KEY:-}
        ELEVENLABS_KEY: ${VSUM_ELEVENLABS_KEY:-}
      volumes:
        - vsum_archive:/archive
      profiles: ["vsum"]
    command: ["web", "--host", "0.0.0.0"]
    ports:
      - "8088:8080"
    # Measured 67 MiB peak (vsum docs/knowledge-base/deployment.md).
    mem_limit: 192m

  vsum-worker:
    <<: *vsum
    command: ["worker"]
    # Measured 321 MiB peak on a 15-minute video; one video at a time.
    mem_limit: 768m

  # DEV only (profile devmail): SMTP sink that receives every alert mail of DEV (Kuma, Diun, Beszel);
  # UI and API on :8025 (config/monitoring.yml).
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    mem_limit: 64m
    profiles: ["devmail"]

volumes:
  postgres_data:
  portainer_data:
  pgadmin_data:
  homarr_data:
  trilium_data:
  actual_data:
  linkwarden_data:
  syncthing_data:
  navidrome_data:
  navidrome_music:
  jellyfin_config:
  jellyfin_cache:
  jellyfin_media:
  immich_upload:
  immich_model_cache:
  immich_postgres:
  beszel_data:
  beszel_agent_data:
  caddy_data:
  caddy_config:
  diun_data:
  vsum_archive:
