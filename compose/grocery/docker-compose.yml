# EasyTodo Grocery — DEV Portainer / compose override
# Bridge + published ports so Portainer shows IP:port (upstream Git compose uses network_mode: host).
# Image is built once from DaveKadziola/easytodo-grocery-list (or reuse easy-todo-grocery-nodb on the host).
# Reachable at http://192.168.122.50:8101 — same URL as host-network deploy.
#
# Postgres: published on the Docker host :5432 → host.docker.internal
# Env vars: set in Portainer stack env (or .env next to this file).

name: easytodo-grocery

services:
  easytodo:
    image: easy-todo-grocery-nodb:latest
    restart: unless-stopped
    ports:
      - "8101:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-todo_grocery}
      DB_USER: ${DB_USER:-prod_todo_grocery}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-prod}
      APP_HOST_NAME: ${APP_HOST_NAME:-0.0.0.0}
      APP_HOST_PORT: ${APP_HOST_PORT:-8101}
      SOCKETIO_HOST: ${SOCKETIO_HOST:-192.168.122.50}
      SOCKETIO_PORT: ${SOCKETIO_PORT:-8101}
    mem_limit: 512m
