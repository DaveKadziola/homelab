# EasyToDo Grocery v2 — Portainer stack `easytodo-grocery` (utils/bootstrap/portainer.sh)
# Image: built by deploy-core.yml from DaveKadziola/easytodo-grocery-list at grocery_ref
# (deploy/Dockerfile); never pushed to a registry. The container runs the DB migrations on start.
# Database: `easytodo` in core Postgres, reached through host.docker.internal (published :5432).
# Variables: the Portainer stack env, written by utils/bootstrap/portainer.sh.

name: easytodo-grocery

services:
  easytodo:
    image: ${GROCERY_IMAGE:?set GROCERY_IMAGE}
    restart: unless-stopped
    ports:
      - "8101:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EASYTODO_DATABASE_URL: postgresql+asyncpg://easytodo:${DB_PASSWORD:?set DB_PASSWORD}@host.docker.internal:5432/easytodo
      EASYTODO_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      EASYTODO_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      EASYTODO_ENV: prod
      # Prod: the OPNsense HAProxy address that reaches the app host (its X-Forwarded-* headers).
      EASYTODO_FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Public on prod: accounts only through an invite link.
      EASYTODO_REGISTRATION_OPEN: "false"
      # smtp once GROCERY_PROTON_SMTP_TOKEN exists for the env, else console (links in the app log).
      EASYTODO_MAIL_BACKEND: ${MAIL_BACKEND:-console}
      EASYTODO_SMTP_HOST: smtp.protonmail.ch
      EASYTODO_SMTP_PORT: "587"
      EASYTODO_SMTP_STARTTLS: "true"
      EASYTODO_SMTP_USER: todo-grocery@dkhomelabserver.xyz
      EASYTODO_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EASYTODO_SMTP_FROM: EasyToDo <todo-grocery@dkhomelabserver.xyz>
    mem_limit: 512m
