---
# Declared identities and application accounts (F7-A).
#
# This file says WHICH accounts must exist and where their secret lives.
# It never contains secret values.
#
#   values live in:  Bitwarden  ->  GitHub Environment secret  ->  .env / API on host
#   generator:       utils/gen-app-credentials.sh
#   inventory:       docs/secrets-inventory.md (names + rotation dates only)
#
# Rule: an account created by hand in a web UI is a bug, not a deployment step.

version: 1

# One real mailbox per environment — these actually receive mail, so app
# notifications and password resets work. Logins are derived from them.
# Never use a reserved TLD such as .local: pgAdmin refuses to start with it.
environment_email:
  dev: dev-homelabnotifications@pm.me
  prod: prod-homelabnotifications@pm.me

# email: environment  ->  resolved from environment_email for the target env
identities:
  homelab-admin:
    email: environment
    username: admin
    role: Human administrator — SSO and app admin panels.
  homelab-notification:
    email: environment
    username: homelab-notification
    role: Sender identity for notifications (Diun, Beszel, alerts).

# inject: env       — password reaches the app through compose environment
#         bootstrap — utils/bootstrap/<app>.sh creates the account through API/CLI
#         manual    — interactive only; must be documented under knowledge/apps/
#         ansible   — a playbook sets it on the target host (Samba on the NAS: deploy-storage.yml)
accounts:
  - app: portainer
    identity: homelab-admin
    login: username
    secret: PORTAINER_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: pgadmin
    identity: homelab-admin
    login: email
    secret: PGADMIN_PASSWORD
    inject: env
    envs: [dev, prod]

  - app: homarr
    identity: homelab-admin
    login: username
    secret: HOMARR_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: authelia
    identity: homelab-admin
    login: username
    secret: AUTHELIA_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]
    notes: Bootstrap regenerates the argon2 hash in compose/core/authelia/users_database.yml.

  - app: linkwarden
    identity: homelab-admin
    login: email
    secret: LINKWARDEN_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: immich
    identity: homelab-admin
    login: email
    secret: IMMICH_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: jellyfin
    identity: homelab-admin
    login: username
    secret: JELLYFIN_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: navidrome
    identity: homelab-admin
    login: username
    secret: NAVIDROME_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]
    notes: First start uses ND_DEVAUTOCREATEADMINPASSWORD; later resets go through navidrome.sh.

  - app: syncthing
    identity: homelab-admin
    login: username
    secret: SYNCTHING_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: samba
    identity: homelab-admin
    login: username
    secret: SAMBA_ADMIN_PASSWORD
    inject: ansible
    envs: [dev, prod]
    notes: >-
      Shares share + media + read-only backups on the NAS. The login maps to the Unix account homelab-smb
      (a Unix user named admin would get sudo through Ubuntu's %admin group).

  - app: grocery
    identity: homelab-admin
    login: email
    secret: GROCERY_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]
    notes: >-
      EasyToDo admin; utils/bootstrap/portainer.sh runs create-admin after the stack deploy. Other
      people join through invite links (registration is closed).

  - app: beszel
    identity: homelab-notification
    login: email
    secret: BESZEL_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]

  - app: homeassistant
    identity: homelab-admin
    login: username
    secret: HA_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev]
    notes: >-
      DEV twin only: utils/ha.py bootstrap does the onboarding. Prod HA is the owner's account on the
      T620; the automation there uses HA_TOKEN.

  - app: uptime-kuma
    identity: homelab-admin
    login: username
    secret: KUMA_ADMIN_PASSWORD
    inject: bootstrap
    envs: [dev, prod]
    notes: Login `admin` of the Uptime Kuma add-on on Home Assistant; utils/kuma-sync.py creates it on a fresh Kuma.

# Secrets that are not login credentials but must exist per environment.
service_secrets:
  - name: POSTGRES_PASSWORD
    used_by: [postgres, linkwarden, actual, trilium, grafana]
    envs: [dev, prod]
  - name: IMMICH_DB_PASSWORD
    used_by: [immich]
    envs: [dev, prod]
  - name: GROCERY_DB_PASSWORD
    used_by: [grocery]
    envs: [dev, prod]
  - name: GROCERY_SECRET_KEY
    used_by: [grocery]
    envs: [dev, prod]
    format: hex64
  - name: GROCERY_PROTON_SMTP_TOKEN
    used_by: [grocery]
    envs: [dev, prod]
    issued_by: proton
    notes: >-
      Proton SMTP token of todo-grocery@dkhomelabserver.xyz. Optional: without it the app keeps
      the console mail backend.
  - name: HOMARR_SECRET_KEY
    used_by: [homarr]
    envs: [dev, prod]
    format: hex64
  - name: LINKWARDEN_SECRET
    used_by: [linkwarden]
    envs: [dev, prod]
  - name: AUTHELIA_JWT_SECRET
    used_by: [authelia]
    envs: [dev, prod]
  - name: AUTHELIA_SESSION_SECRET
    used_by: [authelia]
    envs: [dev, prod]
  - name: AUTHELIA_STORAGE_KEY
    used_by: [authelia]
    envs: [dev, prod]
  - name: HA_TOKEN
    used_by: [homeassistant]
    envs: [dev, prod]
    issued_by: homeassistant
    notes: >-
      Long-lived access token for utils/ha.py. DEV: utils/ha.py bootstrap creates it; prod: the owner
      creates it in the HA profile.
  - name: HA_SSH_PRIV
    used_by: [homeassistant]
    envs: [dev, prod]
    issued_by: ssh-keygen
    notes: >-
      Key of the Terminal & SSH add-on (`ssh-keygen -t ed25519 -N ''`); utils/ha.py derives the public
      half and installs it as the add-on's authorized key.
  - name: KUMA_PUSH_SECRET
    used_by: [uptime-kuma]
    envs: [dev, prod]
    notes: >-
      Seed of the Kuma push tokens (sha256 of "<secret>:<stream>"); utils/kuma-sync.py sets them on
      the monitors, utils/backup/check-fresh.py on the NAS pushes with them.
  - name: SMTP_USERNAME
    used_by: [uptime-kuma, diun, beszel]
    envs: [prod]
    issued_by: proton
    notes: >-
      Address on the Proton custom (sub)domain that sends alert mail; also the From address. The owner
      makes it with an SMTP token in Proton (knowledge/monitoring.md). DEV sends to mailpit, no login.
  - name: SMTP_PASSWORD
    used_by: [uptime-kuma, diun, beszel]
    envs: [prod]
    issued_by: proton
    notes: The Proton SMTP token of SMTP_USERNAME.
  - name: CLOUDFLARE_API_TOKEN
    used_by: [caddy]
    envs: [prod]
    issued_by: cloudflare
    notes: >-
      API token limited to Zone.DNS edit on dkhomelabserver.xyz, for Caddy's DNS challenge (wildcard
      certificate, decision 0007). The owner creates it; without it prod keeps proxy and auth off.
  - name: OPNSENSE_BACKUP_SSH_PRIV
    used_by: [backup]
    envs: [prod]
    issued_by: ssh-keygen
    notes: >-
      Key the NAS uses to fetch config.xml; on the router it may only run `cat /conf/config.xml`
      (utils/f2-opnsense-backup-key.sh makes it and installs the public half).
  - name: HA_BACKUP_PASSWORD
    used_by: [homeassistant]
    envs: [dev, prod]
    notes: Password of the Supervisor backups the NAS pulls (utils/ha.py backup); needed to restore one.
