---
# Storage, NFS exports, backup streams (F5).
# Values never include secrets. Disk by-id is filled on the physical PVE host.
#
# DEV has no SA500/Purple and no second VM (nested PVE is already at 6/8 GiB).
# Exports live on the apps guest under export_root; NFS is loopback so the
# same playbook is exercised.

version: 1

environments:
  dev:
    mode: local
    nas_host: 192.168.122.50
    apps_host: 192.168.122.50
    export_root: /srv/homelab-export
    # Timer runs on the apps guest — always the NFS *mount*, not the NAS path.
    backup_root: /mnt/homelab/backups
    mount_root: /mnt/homelab
    export_clients: [192.168.122.0/24, 127.0.0.1]
    rclone: false
    # DEV twin of the T620: HAOS VM in the laptop libvirt (utils/dev-haos-vm.sh).
    ha_url: http://192.168.122.60
    passthrough: []
    # Proxmox job that dumps the VMs onto the NAS (utils/pve-backup-job.py). Created but disabled
    # on DEV: the nested PVE has no room for a dump of ubuntu-apps-dev.
    vzdump: { pve_host: 192.168.122.219, vmids: [101], schedule: "04:30", enabled: false }
    # NAS-only backups (router config, HA UI YAML, VM dumps): outside export_root, so no NFS client of
    # the export tree (the apps host, as root) reaches them, only the read-only Samba share
    # all-backups from samba.admin_hosts; not offsite.
    nas_private_root: /srv/homelab-nas-backups
    # Host firewall on the NAS guest (deploy-storage.yml, homelab-firewall.service): only these
    # sources open SSH, Samba and NFS; the rest is dropped and logged. NFS clients mount v4.2, so
    # TCP 2049 is all NFS needs and rpcbind, mountd and statd stay closed (audit S6, S24). On DEV the
    # guest is the apps host too: its Docker bridges and its own loopback mount pass.
    firewall:
      # The laptop (operator, runner) and the HAOS twin (Uptime Kuma).
      ssh_from: [192.168.122.1, 192.168.122.60]
      smb_from: [192.168.122.0/24]
      # The nested PVE (storage nas-backups).
      nfs_from: [192.168.122.219]
    # Samba runs on the NAS guest; DEV reaches it from the libvirt network only.
    samba:
      share_path: /srv/homelab-share
      hosts_allow: [192.168.122.0/24, 127.0.0.1]
      # The only clients of the read-only share all-backups: the laptop on the libvirt network.
      admin_hosts: [192.168.122.1]
      # backups/ and nas-backups/ bound read-only here for all-backups; outside export_root.
      admin_view: /srv/backups-all
  prod:
    mode: nfs
    nas_host: 192.168.20.12
    apps_host: 192.168.50.30
    export_root: /export
    backup_root: /mnt/homelab/backups
    mount_root: /mnt/homelab
    export_clients: [192.168.50.0/26]
    rclone: true
    # HA on the T620 serves its UI and API on port 80 (live probe 2026-10-20).
    ha_url: http://192.168.20.13
    # Whole disks passed to ubuntu-nas (utils/pve-attach-nas-disks.sh --env prod). `serial` is
    # handed to the guest (qm serial=) so the playbook finds each disk by it; `label` names the
    # ext4 filesystem it gets once (one-time wipe opt-in, knowledge/storage.md) and fstab mounts
    # it by LABEL. SSD = all media (export_root/media); Purple = backups + the Samba share,
    # mounted outside the NFS tree so the share is neither NFS-visible nor in backups/offsite.
    passthrough:
      - { name: sa500, scsi: 1, ssd: true, serial: 2525GTD00073, label: hl-media, mount: /export/media,
          by_id: /dev/disk/by-id/ata-WD_Red_SA500_2.5_2TB_2525GTD00073 }
      - { name: purple, scsi: 2, ssd: false, serial: WD-WCC7K3KZKJKX, label: hl-purple, mount: /srv/purple,
          by_id: /dev/disk/by-id/ata-WDC_WD40PURZ-85TTDY0_WD-WCC7K3KZKJKX }
    # CT 110 (ci-runner) is not dumped: utils/pve-ci-runner-lxc.sh rebuilds it.
    vzdump: { pve_host: 192.168.20.20, vmids: [101, 102], schedule: "04:30", enabled: true }
    # On Purple next to the bind source /srv/purple/backups, outside the NFS tree (see dev).
    nas_private_root: /srv/purple/nas-backups
    # Host firewall, see dev. IOT devices share the NAS subnet, so only the guest can filter them.
    firewall:
      # Admins (laptop, S23 on LAN and WireGuard; the same list as the OPNsense alias in
      # utils/opnsense-lockdown-remote.sh), the prod runner (deploy, tests) and Uptime Kuma (nas-ssh).
      ssh_from: [192.168.1.20, 192.168.1.21, 10.10.10.2, 10.10.10.3, 10.10.10.4, 10.10.10.5,
                 192.168.20.14, 192.168.20.13]
      smb_from: [192.168.1.0/24, 10.10.10.0/24]
      # apps (the export) and Proxmox (storage nas-backups for the VM dumps).
      nfs_from: [192.168.50.30, 192.168.20.20]
    # Bind mounts that place part of a passthrough fs into the NFS tree.
    binds:
      - { from: /srv/purple/backups, to: /export/backups, label: hl-purple }
    samba:
      share_path: /srv/purple/share
      # LAN + WireGuard. IOT devices sit in the NAS subnet, the router cannot filter them.
      hosts_allow: [192.168.1.0/24, 10.10.10.0/24, 127.0.0.1]
      # The only clients of the read-only share all-backups: the owner's laptop, its static LAN
      # lease and its WireGuard peers (OPNsense alias Admins, since 2026-10-24).
      admin_hosts: [192.168.1.20, 10.10.10.3, 10.10.10.5]
      # backups/ and nas-backups/ bound read-only here for all-backups; outside export_root.
      admin_view: /srv/backups-all

# Layout under export_root (created by ansible/playbooks/deploy-storage.yml). No size caps:
# media totals ~300-400 GB on a 2 TB SSD (owner, 2026-10-19).
exports:
  - { name: media-immich, path: media/immich, app: immich }
  # Photos the owner adds over Samba; Immich reads them as an external library.
  - { name: media-photos, path: media/photos, app: immich }
  - { name: media-music,  path: media/music,  app: navidrome }
  - { name: media-video,  path: media/video,  app: jellyfin }
  # owner: the UID that writes there (default: the ansible user). vsum runs as 10001 in its image.
  - { name: media-vsum,   path: media/vsum,   app: vsum, owner: 10001 }
  - { name: sync,         path: media/sync,   app: syncthing }
  - { name: backups,      path: backups,      app: backup }

# A15: keep the 2 newest artefacts per stream; delete older.
retention:
  keep: 2

streams:
  - { name: postgres,     method: pg_dump,  dest: postgres }
  - { name: volumes,      method: tar,      dest: volumes }
  - { name: homeassistant, method: ha_tar, dest: homeassistant }
  - { name: opnsense,     method: xml,      dest: opnsense }
  - { name: repo-zip,     method: zip,      dest: repo-zip }
  - { name: vzdump,       method: vzdump,   dest: vzdump }

# Offsite is DR only — not Immich/Jellyfin/Navidrome libraries (already on pCloud). Only the streams
# in `include` are copied (rclone --include), and only to an rclone crypt remote: rclone-offsite.sh
# skips a plain remote, because the dumps and volume tars hold app data and credentials. The
# NAS-private streams (opnsense, homeassistant-yaml, vzdump) are not under backup_root at all.
offsite:
  remote: pcloud-crypt:homelab-backups
  secret: RCLONE_CONFIG
  include: [postgres, volumes, homeassistant, repo-zip]
