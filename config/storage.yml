---
# Storage, NFS exports, backup streams (F5).
# Values never include secrets. Disk by-id is filled on the physical PVE host.
#
# DEV has no SA500/Purple and no second VM (nested PVE is already at 6/8 GiB).
# Exports live on the apps guest under export_root; NFS is loopback so the
# same playbook is exercised.

version: 1

environments:
  dev:
    mode: local
    nas_host: 192.168.122.50
    apps_host: 192.168.122.50
    export_root: /srv/homelab-export
    # Timer runs on the apps guest — always the NFS *mount*, not the NAS path.
    backup_root: /mnt/homelab/backups
    mount_root: /mnt/homelab
    export_clients: [192.168.122.0/24, 127.0.0.1]
    rclone: false
    # DEV twin of the T620: HAOS VM in the laptop libvirt (utils/dev-haos-vm.sh).
    ha_url: http://192.168.122.60
    passthrough: []
    # Samba runs on the NAS guest; DEV reaches it from the libvirt network only.
    samba:
      share_path: /srv/homelab-share
      hosts_allow: [192.168.122.0/24, 127.0.0.1]
  prod:
    mode: nfs
    nas_host: 192.168.20.12
    apps_host: 192.168.50.30
    export_root: /export
    backup_root: /mnt/homelab/backups
    mount_root: /mnt/homelab
    export_clients: [192.168.50.0/26]
    rclone: true
    # HA on the T620 serves its UI and API on port 80 (live probe 2026-10-20).
    ha_url: http://192.168.20.13
    # Whole disks passed to ubuntu-nas (utils/pve-attach-nas-disks.sh --env prod). `serial` is
    # handed to the guest (qm serial=) so the playbook finds each disk by it; `label` names the
    # ext4 filesystem it gets once (one-time wipe opt-in, knowledge/storage.md) and fstab mounts
    # it by LABEL. SSD = all media (export_root/media); Purple = backups + the Samba share,
    # mounted outside the NFS tree so the share is neither NFS-visible nor in backups/offsite.
    passthrough:
      - { name: sa500, scsi: 1, ssd: true, serial: 2525GTD00073, label: hl-media, mount: /export/media,
          by_id: /dev/disk/by-id/ata-WD_Red_SA500_2.5_2TB_2525GTD00073 }
      - { name: purple, scsi: 2, ssd: false, serial: WD-WCC7K3KZKJKX, label: hl-purple, mount: /srv/purple,
          by_id: /dev/disk/by-id/ata-WDC_WD40PURZ-85TTDY0_WD-WCC7K3KZKJKX }
    # Bind mounts that place part of a passthrough fs into the NFS tree.
    binds:
      - { from: /srv/purple/backups, to: /export/backups, label: hl-purple }
    samba:
      share_path: /srv/purple/share
      # LAN + WireGuard. IOT devices sit in the NAS subnet, the router cannot filter them.
      hosts_allow: [192.168.1.0/24, 10.10.10.0/24, 127.0.0.1]

# Layout under export_root (created by ansible/playbooks/deploy-storage.yml). No size caps:
# media totals ~300-400 GB on a 2 TB SSD (owner, 2026-10-19).
exports:
  - { name: media-immich, path: media/immich, app: immich }
  - { name: media-music,  path: media/music,  app: navidrome }
  - { name: media-video,  path: media/video,  app: jellyfin }
  - { name: sync,         path: media/sync,   app: syncthing }
  - { name: backups,      path: backups,      app: backup }

# A15: keep the 2 newest artefacts per stream; delete older.
retention:
  keep: 2

streams:
  - { name: postgres,     method: pg_dump,  dest: postgres }
  - { name: volumes,      method: tar,      dest: volumes }
  - { name: homeassistant, method: ha_tar, dest: homeassistant }
  - { name: opnsense,     method: xml,      dest: opnsense }
  - { name: repo-zip,     method: zip,      dest: repo-zip }
  - { name: vzdump,       method: vzdump,   dest: vzdump }

# Offsite is DR only — not Immich/Jellyfin/Navidrome libraries (already on pCloud).
offsite:
  remote: pcloud:homelab-backups
  secret: RCLONE_CONFIG
  include: [postgres, volumes, homeassistant, opnsense, repo-zip, vzdump]
